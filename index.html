<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f6f2">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>MFPI</title>
<link rel="manifest" href="./manifest.webmanifest">
<style>
:root{
  --bg:#f6f6f2;--card:#fff;--text:#111;--muted:#77776f;--line:#dfdfd8;
  --soft:#f0f0eb;--accent:#FDFDC9;--accent-line:#e9e997;--r:22px
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Inter,Arial,sans-serif;letter-spacing:-.02em}
button,input,select{font:inherit}button{cursor:pointer}
.app{max-width:720px;margin:auto;padding:calc(18px + env(safe-area-inset-top)) 14px calc(92px + env(safe-area-inset-bottom))}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
.logo{font-size:28px;font-weight:850;letter-spacing:-.07em}
.icon{width:44px;height:44px;border:1px solid var(--line);border-radius:50%;background:var(--card);font-size:19px}
.date{font-size:13px;color:var(--muted);margin-bottom:12px;text-transform:capitalize}
.overview{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:20px;margin-bottom:14px}
.overviewTop{display:flex;align-items:end;justify-content:space-between;gap:12px}
.overview h1{font-size:34px;line-height:1;margin:0;letter-spacing:-.06em}
.overview p{margin:5px 0 0;font-size:14px;color:var(--muted)}
.streak{font-size:13px;color:var(--muted);white-space:nowrap}
.segments{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:18px}
.segment{height:10px;border-radius:999px;background:var(--soft);border:1px solid var(--line);overflow:hidden}
.segmentFill{height:100%;width:var(--fill,0%);background:var(--accent);border-radius:inherit;transition:width .25s ease}
.segmentLabels{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:7px;font-size:10px;font-weight:800;letter-spacing:.08em;color:var(--muted);text-align:center}
.list{display:grid;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.cardHead{display:flex;align-items:center;gap:12px}
.badge{width:42px;height:42px;border-radius:14px;background:var(--soft);border:1px solid var(--line);display:grid;place-items:center;font-weight:850;font-size:17px;flex:none}
.titleWrap{min-width:0;flex:1}
.kind{font-size:11px;color:var(--muted);font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.goal{font-size:20px;font-weight:750;letter-spacing:-.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.count{font-size:12px;color:var(--muted);white-space:nowrap}
.tasks{display:grid;gap:8px;margin-top:14px}
.task{display:grid;grid-template-columns:26px 1fr 22px;gap:9px;align-items:center;min-height:42px;padding:8px 9px;border-radius:13px;background:var(--bg)}
.check{width:24px;height:24px;border-radius:8px;border:1.5px solid #999;background:#fff;padding:0}
.task.done{background:#fafaf6}
.task.done .check{background:var(--accent);color:#111;border-color:var(--accent-line)}
.task.done .txt{text-decoration:line-through;color:#74746d}
.txt{font-size:15px;line-height:1.3}
.remove{border:0;background:none;color:var(--muted);padding:0;font-size:18px}
.empty{font-size:13px;color:var(--muted);padding:4px 0}
.add{display:flex;gap:8px;margin-top:10px}
.add input{width:100%;min-width:0;height:44px;border:1px solid var(--line);border-radius:13px;padding:0 13px;background:#fff;color:var(--text)}
.add button{width:44px;height:44px;border:1px solid var(--line);border-radius:13px;background:#111;color:#fff;font-size:22px}
.editGoal{border:0;background:none;padding:0;text-align:left;width:100%;color:inherit}
.bottomNav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));width:min(420px,calc(100% - 24px));background:#111;border-radius:20px;padding:6px;display:grid;grid-template-columns:1fr 1fr;z-index:30;box-shadow:0 10px 34px #0003}
.navBtn{height:48px;border:0;border-radius:15px;background:transparent;color:#aaa;font-weight:750}
.navBtn.active{background:var(--accent);color:#111}
.screen{display:none}.screen.active{display:block}
.expHeader{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.expHeader h2{font-size:28px;margin:0;letter-spacing:-.05em}
.pill{border:1px solid var(--line);background:var(--card);border-radius:999px;min-height:42px;padding:0 15px}
.expList{display:grid;gap:10px}
.exp{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px}
.expTop{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.expTag{display:inline-flex;align-items:center;min-height:26px;padding:0 9px;border-radius:999px;background:var(--soft);border:1px solid var(--line);font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.exp h3{font-size:19px;line-height:1.15;margin:10px 0 0;letter-spacing:-.035em}
.exp button{border:0;background:none;color:var(--muted);font-size:18px;padding:0}
.expMeta{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.expMeta span{font-size:12px;color:var(--muted);background:var(--bg);border-radius:999px;padding:7px 9px}
.expDetail{margin-top:13px;padding-top:13px;border-top:1px solid var(--line)}
.expDetail dt{font-size:11px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.06em;margin-top:10px}
.expDetail dt:first-child{margin-top:0}
.expDetail dd{margin:4px 0 0;font-size:14px;line-height:1.45}
.expStatus{font-size:12px;font-weight:750}
.expStatus.active{color:#4e641d}.expStatus.finished{color:var(--muted)}
dialog{width:min(500px,calc(100% - 28px));border:1px solid var(--line);border-radius:24px;padding:0;background:var(--card);color:var(--text)}
dialog::backdrop{background:#0007;backdrop-filter:blur(5px)}
.modal{padding:22px}.modal h2{font-size:26px;margin:0 0 16px;letter-spacing:-.05em}
.field{margin:12px 0}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:13px;padding:13px;background:white;color:var(--text)}
.field textarea{min-height:92px;resize:vertical}
.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.primary{border:1px solid #111;background:#111;color:#fff;border-radius:999px;min-height:42px;padding:0 17px;font-weight:750}
.menu{position:fixed;right:14px;bottom:calc(82px + env(safe-area-inset-bottom));width:min(290px,calc(100% - 28px));display:none;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:8px;z-index:40;box-shadow:0 18px 50px #0002}
.menu.open{display:block}.menu button,.menu label{display:flex;width:100%;min-height:43px;align-items:center;border:0;background:none;border-radius:11px;padding:0 12px}
.danger{color:#a11}.hide{display:none}
@media(prefers-color-scheme:dark){
  :root{--bg:#111;--card:#1a1a1a;--text:#f4f4ef;--muted:#9b9b94;--line:#303030;--soft:#252525}
  .add input,.field input,.field select,.field textarea{background:#222;color:var(--text)}
  .task{background:#222}.task.done{background:#20201b}.check{background:#1a1a1a}
  .add button,.primary{background:#f4f4ef;color:#111;border-color:#f4f4ef}
}
</style>
</head>
<body>
<main class="app">
<header class="topbar"><div class="logo">MFPI</div><button class="icon" id="menuBtn">•••</button></header>
<section id="todayScreen" class="screen active">
  <div class="date" id="date"></div>
  <section class="overview">
    <div class="overviewTop"><div><h1 id="progressTitle">0 из 0</h1><p>задач выполнено сегодня</p></div><div class="streak" id="streak">0 дней подряд</div></div>
    <div class="segments" id="segments"></div>
    <div class="segmentLabels"><span>M</span><span>F</span><span>P</span><span>I</span></div>
  </section>
  <section class="list" id="grid"></section>
</section>
<section id="experimentsScreen" class="screen">
  <div class="expHeader"><h2>Эксперименты</h2><button class="pill" id="addExp">Добавить</button></div>
  <div class="expList" id="expList"></div>
</section>
</main>
<nav class="bottomNav"><button class="navBtn active" data-screen="todayScreen">Сегодня</button><button class="navBtn" data-screen="experimentsScreen">Эксперименты</button></nav>
<div class="menu" id="menu"><button id="editAll">Изменить направления</button><button id="export">Экспорт данных</button><label for="import">Импорт данных</label><input class="hide" id="import" type="file" accept="application/json"><button id="clearDay">Очистить сегодня</button><button class="danger" id="reset">Удалить всё</button></div>
<dialog id="setup"><form class="modal" id="setupForm"><h2 id="setupTitle"></h2><div class="field"><input id="setupInput" maxlength="120"></div><div class="actions"><button type="button" class="pill" id="back">Назад</button><button class="primary" id="next">Далее</button></div></form></dialog>
<dialog id="edit"><form class="modal" id="editForm"><h2 id="editTitle">Изменить</h2><div class="field"><input id="editInput" maxlength="120"></div><div class="actions"><button type="button" class="pill close">Отмена</button><button class="primary">Сохранить</button></div></form></dialog>
<dialog id="expDialog"><form class="modal" id="expForm"><h2>Новый эксперимент</h2>
<div class="field"><label>Категория</label><select id="expCat"></select></div>
<div class="field"><label>Название эксперимента</label><input id="expName" required maxlength="140" placeholder="Например: 30 дней кастингов"></div>
<div class="field"><label>Цель эксперимента</label><input id="expGoal" maxlength="180" placeholder="Что хочешь проверить или получить"></div>
<div class="field"><label>Описание</label><textarea id="expDescription" maxlength="700" placeholder="Что именно будешь делать"></textarea></div>
<div class="field"><label>Критерий успеха</label><textarea id="expCriteria" maxlength="500" placeholder="По каким признакам решишь, продолжать ли"></textarea></div>
<div class="field"><label>Дата начала</label><input id="expStart" type="date" required></div>
<div class="field"><label>Дата завершения</label><input id="expEnd" type="date" required></div>
<div class="actions"><button type="button" class="pill close">Отмена</button><button class="primary">Создать</button></div></form></dialog>
<script>
(()=>{const M=[['main','M','Главная'],['finance','F','Доходная'],['future','P','Перспективная'],['involve','I','Вовлекающая']];const O=[['main','Главная цель','Например: моделинг'],['finance','Доходное дело','Например: монтаж'],['future','Перспективное направление','Например: AI'],['involve','Вовлекающее дело','Например: музыка']];const fresh=()=>({onboarded:false,goals:{main:'',finance:'',future:'',involve:''},days:{},experiments:[]});let S;try{S=JSON.parse(localStorage.mfpi)||fresh()}catch{S=fresh()}let step=0,draft={},editing='';const $=q=>document.querySelector(q),key=(d=new Date())=>d.toLocaleDateString('en-CA'),uid=()=>crypto.randomUUID?.()||Date.now()+Math.random(),esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),formatDate=x=>new Intl.DateTimeFormat('ru-RU',{day:'numeric',month:'short',year:'numeric'}).format(new Date(x+'T12:00:00'));function day(){return S.days[key()]||(S.days[key()]={tasks:{main:[],finance:[],future:[],involve:[]}})}function save(){localStorage.mfpi=JSON.stringify(S)}function render(){const D=day();$('#date').textContent=new Intl.DateTimeFormat('ru-RU',{weekday:'long',day:'numeric',month:'long'}).format(new Date());const allTasks=M.flatMap(m=>D.tasks[m[0]]||[]),totalTasks=allTasks.length,totalDone=allTasks.filter(x=>x.done).length;$('#progressTitle').textContent=totalDone+' из '+totalTasks;$('#segments').innerHTML=M.map(m=>{const tasks=D.tasks[m[0]]||[],done=tasks.filter(x=>x.done).length,fill=tasks.length?Math.round(done/tasks.length*100):0;return `<div class="segment" title="${m[2]}: ${done}/${tasks.length}"><div class="segmentFill" style="--fill:${fill}%"></div></div>`}).join('');$('#grid').innerHTML=M.map(m=>{const t=D.tasks[m[0]]||[],done=t.filter(x=>x.done).length;return `<article class="card"><div class="cardHead"><div class="badge">${m[1]}</div><div class="titleWrap"><div class="kind">${m[2]}</div><button class="editGoal" data-edit="${m[0]}"><div class="goal">${esc(S.goals[m[0]]||'Не определено')}</div></button></div><div class="count">${done}/${t.length}</div></div><div class="tasks">${t.length?t.map(x=>`<div class="task ${x.done?'done':''}" data-c="${m[0]}" data-id="${x.id}"><button class="check">${x.done?'✓':''}</button><div class="txt">${esc(x.text)}</div><button class="remove">×</button></div>`).join(''):'<div class="empty">Добавь один шаг на сегодня</div>'}</div><form class="add" data-c="${m[0]}"><input placeholder="Новый шаг" maxlength="120"><button>+</button></form></article>`}).join('');let n=0,c=new Date();while(true){const z=S.days[key(c)],ok=z&&M.every(m=>z.tasks?.[m[0]]?.some(x=>x.done));if(!ok)break;n++;c.setDate(c.getDate()-1)}$('#streak').textContent=n+' '+(n===1?'день':'дней')+' подряд';$('#expCat').innerHTML=M.map(m=>`<option value="${m[0]}">${m[2]}</option>`).join('');$('#expList').innerHTML=S.experiments.length?S.experiments.slice().sort((a,b)=>(a.end||'').localeCompare(b.end||'')).map(x=>{const cat=M.find(m=>m[0]===x.cat),end=x.end||'',start=x.start||'',d=end?Math.ceil((new Date(end+'T23:59:59')-new Date())/864e5):null,status=d===null?'Без срока':d>0?d+' дн. осталось':d===0?'Завершается сегодня':'Завершён',active=d===null||d>=0;return `<article class="exp"><div class="expTop"><div><span class="expTag">${cat?cat[1]+' · '+cat[2]:'Без категории'}</span><h3>${esc(x.name||'Без названия')}</h3></div><button data-del="${x.id}" aria-label="Удалить">×</button></div><div class="expMeta"><span class="expStatus ${active?'active':'finished'}">${status}</span>${start?`<span>Старт: ${formatDate(start)}</span>`:''}${end?`<span>До: ${formatDate(end)}</span>`:''}</div><dl class="expDetail">${(x.goal||S.goals[x.cat])?`<dt>Цель</dt><dd>${esc(x.goal||S.goals[x.cat])}</dd>`:''}${x.description?`<dt>Описание</dt><dd>${esc(x.description)}</dd>`:''}${x.criteria?`<dt>Критерий успеха</dt><dd>${esc(x.criteria)}</dd>`:''}</dl></article>`}).join(''):'<div class="empty">Экспериментов пока нет</div>';save()}function openSetup(){draft={...S.goals};step=0;showStep();$('#setup').showModal()}function showStep(){const x=O[step];$('#setupTitle').textContent=x[1];$('#setupInput').placeholder=x[2];$('#setupInput').value=draft[x[0]]||'';$('#back').style.visibility=step?'visible':'hidden';$('#next').textContent=step===3?'Готово':'Далее';setTimeout(()=>$('#setupInput').focus(),30)}$('#setupForm').onsubmit=e=>{e.preventDefault();const x=O[step],v=$('#setupInput').value.trim();if(!v)return;draft[x[0]]=v;if(step<3){step++;showStep()}else{S.goals={...draft};S.onboarded=true;$('#setup').close();render()}};$('#back').onclick=()=>{if(step){draft[O[step][0]]=$('#setupInput').value.trim();step--;showStep()}};$('#grid').onsubmit=e=>{const f=e.target.closest('.add');if(!f)return;e.preventDefault();const i=f.querySelector('input'),v=i.value.trim();if(!v)return;day().tasks[f.dataset.c].push({id:uid(),text:v,done:false});i.value='';render()};$('#grid').onclick=e=>{const task=e.target.closest('.task');if(task&&e.target.closest('.check')){const x=day().tasks[task.dataset.c].find(x=>String(x.id)===task.dataset.id);if(x)x.done=!x.done;render();return}if(task&&e.target.closest('.remove')){day().tasks[task.dataset.c]=day().tasks[task.dataset.c].filter(x=>String(x.id)!==task.dataset.id);render();return}const b=e.target.closest('[data-edit]');if(b){editing=b.dataset.edit;$('#editTitle').textContent=M.find(m=>m[0]===editing)[2];$('#editInput').value=S.goals[editing]||'';$('#edit').showModal()}};$('#editForm').onsubmit=e=>{e.preventDefault();const v=$('#editInput').value.trim();if(v)S.goals[editing]=v;$('#edit').close();render()};document.querySelectorAll('.close').forEach(b=>b.onclick=()=>b.closest('dialog').close());$('#addExp').onclick=()=>{const start=new Date(),end=new Date();end.setDate(end.getDate()+30);$('#expStart').value=key(start);$('#expEnd').value=key(end);$('#expName').value='';$('#expGoal').value='';$('#expDescription').value='';$('#expCriteria').value='';$('#expDialog').showModal()};$('#expForm').onsubmit=e=>{e.preventDefault();S.experiments.push({id:uid(),cat:$('#expCat').value,name:$('#expName').value.trim(),goal:$('#expGoal').value.trim(),description:$('#expDescription').value.trim(),criteria:$('#expCriteria').value.trim(),start:$('#expStart').value,end:$('#expEnd').value,createdAt:new Date().toISOString()});$('#expDialog').close();render()};$('#expList').onclick=e=>{const b=e.target.closest('[data-del]');if(b){S.experiments=S.experiments.filter(x=>String(x.id)!==b.dataset.del);render()}};document.querySelectorAll('.navBtn').forEach(b=>b.onclick=()=>{document.querySelectorAll('.navBtn').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('#'+b.dataset.screen).classList.add('active')});$('#menuBtn').onclick=e=>{e.stopPropagation();$('#menu').classList.toggle('open')};document.onclick=e=>{if(!$('#menu').contains(e.target)&&e.target!==$('#menuBtn'))$('#menu').classList.remove('open')};$('#editAll').onclick=()=>{openSetup();$('#menu').classList.remove('open')};$('#clearDay').onclick=()=>{if(confirm('Очистить задачи на сегодня?')){S.days[key()]={tasks:{main:[],finance:[],future:[],involve:[]}};render()}};$('#reset').onclick=()=>{if(confirm('Удалить все данные?')){S=fresh();render();openSetup()}};$('#export').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));a.download='mfpi-backup.json';a.click()};$('#import').onchange=async e=>{try{S=JSON.parse(await e.target.files[0].text());render()}catch{alert('Не удалось импортировать файл')}};render();if(!S.onboarded)openSetup()})();
</script>
</body></html>
