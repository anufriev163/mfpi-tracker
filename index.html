<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#FDFDC9"><meta name="apple-mobile-web-app-capable" content="yes"><title>MFPI</title><link rel="manifest" href="./manifest.webmanifest"><style>:root{--bg:#f5f5f1;--card:#fff;--text:#111;--muted:#777;--line:#deded8;--accent:#FDFDC9;--r:18px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Inter,Arial,sans-serif;letter-spacing:-.02em}button,input,select{font:inherit}button{cursor:pointer}.wrap{max-width:760px;margin:auto;padding:calc(20px + env(safe-area-inset-top)) 16px calc(64px + env(safe-area-inset-bottom))}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}.logo{font-size:26px;font-weight:850;letter-spacing:-.06em}.menuBtn,.pill{border:1px solid var(--line);background:var(--card);border-radius:999px;min-height:42px;padding:0 15px}.today{font-size:13px;color:var(--muted);margin-bottom:12px}.progress{background:var(--accent);border:1px solid #eded9d;border-radius:22px;padding:20px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:end;gap:12px}.progress strong{font-size:44px;line-height:.9;letter-spacing:-.07em}.progress span{font-size:14px;color:#50503d}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;min-height:215px}.top{display:flex;justify-content:space-between;gap:8px}.tag{font-size:11px;font-weight:800;letter-spacing:.1em;color:var(--muted)}h2{margin:4px 0 0;font-size:21px;letter-spacing:-.04em}.edit{border:0;background:none;color:var(--muted);padding:0}.goal{margin:14px 0 12px;background:var(--accent);border-radius:13px;padding:12px;font-weight:700;line-height:1.3}.tasks{display:grid;gap:8px}.empty{color:var(--muted);font-size:13px}.task{display:grid;grid-template-columns:22px 1fr 20px;gap:8px;align-items:start;font-size:14px}.check{width:21px;height:21px;border-radius:7px;border:1.5px solid #999;background:white;padding:0}.task.done .check{background:#111;color:#fff;border-color:#111}.task.done .txt{text-decoration:line-through;color:var(--muted)}.x{border:0;background:none;color:var(--muted);padding:0;font-size:17px}.add{display:flex;gap:8px;margin-top:auto;padding-top:12px}.add input{width:100%;min-width:0;height:41px;border:1px solid var(--line);border-radius:11px;padding:0 11px;background:white}.add button{width:41px;height:41px;border:0;border-radius:11px;background:var(--accent);font-size:20px}.experiments{margin-top:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}.expHead{display:flex;justify-content:space-between;align-items:center}.expHead h2{margin:0}.expList{display:grid;gap:8px;margin-top:12px}.exp{display:flex;justify-content:space-between;gap:10px;padding:11px 12px;background:var(--bg);border-radius:12px}.exp b{font-size:14px}.exp small{display:block;color:var(--muted);margin-top:2px}.exp button{border:0;background:none;color:var(--muted)}dialog{width:min(500px,calc(100% - 28px));border:1px solid var(--line);border-radius:22px;padding:0;background:var(--card);color:var(--text)}dialog::backdrop{background:#0006;backdrop-filter:blur(4px)}.modal{padding:20px}.modal h2{font-size:25px;margin:0 0 16px}.field{margin:12px 0}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}.field input,.field select{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;background:white;color:var(--text)}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.primary{border:1px solid #e5e58f;background:var(--accent);border-radius:999px;min-height:42px;padding:0 16px;font-weight:750}.menu{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));width:min(290px,calc(100% - 32px));display:none;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:8px;z-index:20}.menu.open{display:block}.menu button,.menu label{display:flex;width:100%;min-height:42px;align-items:center;border:0;background:none;border-radius:10px;padding:0 11px}.danger{color:#a11}.hide{display:none}@media(max-width:620px){.grid{grid-template-columns:1fr}.card{min-height:195px}}@media(prefers-color-scheme:dark){:root{--bg:#111;--card:#191919;--text:#f4f4ef;--muted:#999;--line:#303030}.progress,.goal,.add button,.primary{color:#111}.field input,.field select,.add input{background:#222;color:var(--text)}.check{background:#191919}.task.done .check{background:var(--accent);color:#111;border-color:var(--accent)}}</style></head><body><main class="wrap"><header><div class="logo">MFPI</div><button class="menuBtn" id="menuBtn">•••</button></header><div class="today" id="date"></div><section class="progress"><div><strong id="percent">0%</strong><br><span id="status">0 из 4 направлений</span></div><span id="streak">0 дней подряд</span></section><section class="grid" id="grid"></section><section class="experiments"><div class="expHead"><h2>Эксперименты</h2><button class="pill" id="addExp">Добавить</button></div><div class="expList" id="expList"></div></section></main><div class="menu" id="menu"><button id="editAll">Изменить направления</button><button id="export">Экспорт данных</button><label for="import">Импорт данных</label><input class="hide" id="import" type="file" accept="application/json"><button id="clearDay">Очистить сегодня</button><button class="danger" id="reset">Удалить всё</button></div><dialog id="setup"><form class="modal" id="setupForm"><h2 id="setupTitle"></h2><div class="field"><input id="setupInput" maxlength="120"></div><div class="actions"><button type="button" class="pill" id="back">Назад</button><button class="primary" id="next">Далее</button></div></form></dialog><dialog id="edit"><form class="modal" id="editForm"><h2 id="editTitle">Изменить</h2><div class="field"><input id="editInput" maxlength="120"></div><div class="actions"><button type="button" class="pill close">Отмена</button><button class="primary">Сохранить</button></div></form></dialog><dialog id="expDialog"><form class="modal" id="expForm"><h2>Новый эксперимент</h2><div class="field"><label>Категория</label><select id="expCat"></select></div><div class="field"><label>Что проверяешь</label><input id="expName" required maxlength="140"></div><div class="field"><label>До какой даты</label><input id="expEnd" type="date" required></div><div class="actions"><button type="button" class="pill close">Отмена</button><button class="primary">Создать</button></div></form></dialog><script>(()=>{const M=[['main','M','Главная'],['finance','F','Доходная'],['future','P','Перспективная'],['involve','I','Вовлекающая']];const O=[['main','Главная цель','Например: моделинг'],['finance','Доходное дело','Например: монтаж'],['future','Перспективное направление','Например: AI'],['involve','Вовлекающее дело','Например: музыка']];const fresh=()=>({onboarded:false,goals:{main:'',finance:'',future:'',involve:''},days:{},experiments:[]});let S;try{S=JSON.parse(localStorage.mfpi)||fresh()}catch{S=fresh()}let step=0,draft={},editing='';const $=q=>document.querySelector(q),key=(d=new Date())=>d.toLocaleDateString('en-CA'),uid=()=>crypto.randomUUID?.()||Date.now()+Math.random(),esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function day(){return S.days[key()]||(S.days[key()]={tasks:{main:[],finance:[],future:[],involve:[]}})}function save(){localStorage.mfpi=JSON.stringify(S)}function render(){const D=day();$('#date').textContent=new Intl.DateTimeFormat('ru-RU',{weekday:'long',day:'numeric',month:'long'}).format(new Date());$('#grid').innerHTML=M.map(m=>{const t=D.tasks[m[0]]||[];return `<article class="card"><div class="top"><div><div class="tag">${m[1]}</div><h2>${m[2]}</h2></div><button class="edit" data-edit="${m[0]}">Изменить</button></div><div class="goal">${esc(S.goals[m[0]]||'Не определено')}</div><div class="tasks">${t.length?t.map(x=>`<div class="task ${x.done?'done':''}" data-c="${m[0]}" data-id="${x.id}"><button class="check">${x.done?'✓':''}</button><div class="txt">${esc(x.text)}</div><button class="x">×</button></div>`).join(''):'<div class="empty">Нет задач на сегодня</div>'}</div><form class="add" data-c="${m[0]}"><input placeholder="Добавить шаг" maxlength="120"><button>+</button></form></article>`}).join('');const covered=M.filter(m=>D.tasks[m[0]]?.some(x=>x.done)).length;$('#percent').textContent=covered*25+'%';$('#status').textContent=covered+' из 4 направлений';let n=0,c=new Date();while(true){const z=S.days[key(c)],ok=z&&M.every(m=>z.tasks?.[m[0]]?.some(x=>x.done));if(!ok)break;n++;c.setDate(c.getDate()-1)}$('#streak').textContent=n+' '+(n===1?'день':'дней')+' подряд';$('#expCat').innerHTML=M.map(m=>`<option value="${m[0]}">${m[2]}</option>`).join('');$('#expList').innerHTML=S.experiments.length?S.experiments.map(x=>{const d=Math.ceil((new Date(x.end+'T23:59:59')-new Date())/864e5);return `<div class="exp"><div><b>${esc(x.name)}</b><small>${d>0?d+' дн. осталось':d===0?'Сегодня':'Завершён'}</small></div><button data-del="${x.id}">×</button></div>`}).join(''):'<div class="empty">Пока нет экспериментов</div>';save()}function openSetup(){draft={...S.goals};step=0;showStep();$('#setup').showModal()}function showStep(){const x=O[step];$('#setupTitle').textContent=x[1];$('#setupInput').placeholder=x[2];$('#setupInput').value=draft[x[0]]||'';$('#back').style.visibility=step?'visible':'hidden';$('#next').textContent=step===3?'Готово':'Далее';setTimeout(()=>$('#setupInput').focus(),30)}$('#setupForm').onsubmit=e=>{e.preventDefault();const x=O[step],v=$('#setupInput').value.trim();if(!v)return;draft[x[0]]=v;if(step<3){step++;showStep()}else{S.goals={...draft};S.onboarded=true;$('#setup').close();render()}};$('#back').onclick=()=>{if(step){draft[O[step][0]]=$('#setupInput').value.trim();step--;showStep()}};$('#grid').onsubmit=e=>{const f=e.target.closest('.add');if(!f)return;e.preventDefault();const i=f.querySelector('input'),v=i.value.trim();if(!v)return;day().tasks[f.dataset.c].push({id:uid(),text:v,done:false});i.value='';render()};$('#grid').onclick=e=>{const task=e.target.closest('.task');if(task&&e.target.closest('.check')){const x=day().tasks[task.dataset.c].find(x=>String(x.id)===task.dataset.id);if(x)x.done=!x.done;render();return}if(task&&e.target.closest('.x')){day().tasks[task.dataset.c]=day().tasks[task.dataset.c].filter(x=>String(x.id)!==task.dataset.id);render();return}const b=e.target.closest('[data-edit]');if(b){editing=b.dataset.edit;$('#editTitle').textContent=M.find(m=>m[0]===editing)[2];$('#editInput').value=S.goals[editing]||'';$('#edit').showModal()}};$('#editForm').onsubmit=e=>{e.preventDefault();const v=$('#editInput').value.trim();if(v)S.goals[editing]=v;$('#edit').close();render()};document.querySelectorAll('.close').forEach(b=>b.onclick=()=>b.closest('dialog').close());$('#addExp').onclick=()=>{const d=new Date();d.setDate(d.getDate()+30);$('#expEnd').value=key(d);$('#expName').value='';$('#expDialog').showModal()};$('#expForm').onsubmit=e=>{e.preventDefault();S.experiments.push({id:uid(),cat:$('#expCat').value,name:$('#expName').value.trim(),end:$('#expEnd').value});$('#expDialog').close();render()};$('#expList').onclick=e=>{const b=e.target.closest('[data-del]');if(b){S.experiments=S.experiments.filter(x=>String(x.id)!==b.dataset.del);render()}};$('#menuBtn').onclick=e=>{e.stopPropagation();$('#menu').classList.toggle('open')};document.onclick=e=>{if(!$('#menu').contains(e.target)&&e.target!==$('#menuBtn'))$('#menu').classList.remove('open')};$('#editAll').onclick=()=>{openSetup();$('#menu').classList.remove('open')};$('#clearDay').onclick=()=>{if(confirm('Очистить задачи на сегодня?')){S.days[key()]={tasks:{main:[],finance:[],future:[],involve:[]}};render()}};$('#reset').onclick=()=>{if(confirm('Удалить все данные?')){S=fresh();render();openSetup()}};$('#export').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));a.download='mfpi-backup.json';a.click()};$('#import').onchange=async e=>{try{S=JSON.parse(await e.target.files[0].text());render()}catch{alert('Не удалось импортировать файл')}};render();if(!S.onboarded)openSetup()})();</script></body></html>
