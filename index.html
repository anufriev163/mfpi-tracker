<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7faff">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>MFPI</title>
<link rel="manifest" href="./manifest.webmanifest">
<style>
:root{
 --bg:#f7faff;--card:#ffffff;--text:#172033;--muted:#667085;--line:#dfe7f1;
 --soft:#f0f6fd;--accent:#4b9fff;--accent-strong:#1877e8;--accent-soft:#e9f3ff;--r:22px
}
*{box-sizing:border-box}
html{background:#f7faff;color-scheme:light}
body{margin:0;min-height:100vh;background:#f7faff;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Inter,Arial,sans-serif;letter-spacing:-.02em}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
.app{max-width:720px;margin:auto;padding:calc(18px + env(safe-area-inset-top)) 14px calc(18px + env(safe-area-inset-bottom))}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
.logo{font-size:28px;font-weight:850;letter-spacing:-.07em}
.icon{width:44px;height:44px;border:1px solid var(--line);border-radius:50%;background:#fff;font-size:19px;box-shadow:0 3px 12px rgba(36,87,135,.06)}
.date{font-size:13px;color:var(--muted);margin-bottom:12px;text-transform:capitalize}
.overview,.card,.weekCard,.exp{background:#fff;border:1px solid var(--line);box-shadow:0 5px 18px rgba(40,83,125,.055)}
.overview{border-radius:26px;padding:20px;margin-bottom:14px}
.overviewTop{display:flex;align-items:end;justify-content:space-between;gap:12px}
.overview h1{font-size:34px;line-height:1;margin:0;letter-spacing:-.06em}.overview p{margin:5px 0 0;font-size:14px;color:var(--muted)}
.streak{font-size:13px;color:var(--accent-strong);font-weight:700;white-space:nowrap}
.segments{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:18px}
.segment{height:10px;border-radius:999px;background:#edf2f7;border:1px solid #e4eaf1;overflow:hidden}
.segmentFill{height:100%;width:var(--fill,0%);background:var(--accent);border-radius:inherit;transition:width .25s ease}
.segmentLabels{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:7px;font-size:10px;font-weight:800;letter-spacing:.08em;color:var(--muted);text-align:center}
.list{display:grid;gap:12px}.card{border-radius:var(--r);padding:16px}
.cardHead,.weekHead{display:flex;align-items:center;gap:12px}
.badge{width:42px;height:42px;border-radius:14px;background:var(--accent-soft);border:1px solid #d7e9ff;color:var(--accent-strong);display:grid;place-items:center;font-weight:850;font-size:17px;flex:none}
.titleWrap{min-width:0;flex:1}.kind{font-size:11px;color:var(--muted);font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.goal{font-size:20px;font-weight:750;letter-spacing:-.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.count{font-size:12px;color:var(--muted);white-space:nowrap}.tasks{display:grid;gap:8px;margin-top:14px}
.task{display:grid;grid-template-columns:26px 1fr 22px;gap:9px;align-items:center;min-height:42px;padding:8px 9px;border-radius:13px;background:#f7f9fc;border:1px solid #edf1f5}
.check{width:24px;height:24px;border-radius:8px;border:1.5px solid #aab4c0;background:#fff;padding:0}
.task.done{background:var(--accent-soft);border-color:#d9eaff}.task.done .check{background:var(--accent);color:#fff;border-color:var(--accent)}
.task.done .txt{text-decoration:line-through;color:#738096}.txt{font-size:15px;line-height:1.3}.remove{border:0;background:none;color:#9aa4b2;padding:0;font-size:18px}
.empty{font-size:13px;color:var(--muted);padding:4px 0}.add{display:flex;gap:8px;margin-top:10px}
.add input,.field input,.field select,.field textarea{background:#fff;color:var(--text);border:1px solid #d7e0ea;outline:none}
.add input:focus,.field input:focus,.field select:focus,.field textarea:focus{border-color:#8fc4ff;box-shadow:0 0 0 3px #e6f2ff}
.add input{width:100%;min-width:0;height:44px;border-radius:13px;padding:0 13px}.add button{width:44px;height:44px;border:0;border-radius:13px;background:var(--accent);color:#fff;font-size:22px}
.editGoal{border:0;background:none;padding:0;text-align:left;width:100%;color:inherit}


.bottomNav{position:relative;left:auto;bottom:auto;transform:none;width:min(470px,100%)!important;height:62px;margin:28px auto 0;background:#fff;border:1px solid #dfe7f1;border-radius:22px;padding:5px;display:grid!important;grid-template-columns:repeat(3,minmax(0,1fr))!important;box-shadow:0 8px 24px rgba(41,67,96,.10)}


.navBtn{position:relative;z-index:1;height:50px;min-width:0;border:0;border-radius:17px;background:transparent;color:#667085;font-weight:720;font-size:14px;letter-spacing:-.02em;white-space:nowrap;padding:0 10px}
.navBtn.active{background:#e5f2ff;color:#176dc3;box-shadow:inset 0 0 0 1px #c9e2fb}
.screen{display:none}.screen.active{display:block}
.weekHero{background:#e8f3ff;border:1px solid #cfe5fb;color:#174b7a;border-radius:26px;padding:20px;margin-bottom:14px;box-shadow:0 5px 18px rgba(40,83,125,.05)}
.weekHero small{color:#52769a;font-size:12px;font-weight:700}.weekHero h2{font-size:30px;margin:6px 0 14px;letter-spacing:-.055em}
.weekBar{height:10px;background:#fff;border:1px solid #cfe1f3;border-radius:999px;overflow:hidden}.weekBar>i{display:block;height:100%;background:var(--accent);border-radius:999px;width:var(--w,0%)}
.weekStats{display:flex;justify-content:space-between;margin-top:8px;font-size:12px;color:#52708d}
.weekList{display:grid;gap:12px}.weekCard{border-radius:var(--r);padding:16px}.weekGoal{font-size:18px;font-weight:750;margin-top:2px}
.weekProgress{margin-top:14px}.weekProgress input{width:100%;accent-color:var(--accent)}.weekNumbers{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-top:4px}
.weekEdit{border:0;background:none;color:var(--accent-strong);padding:0;font-size:13px;font-weight:700}
.expHeader{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.expHeader h2{font-size:28px;margin:0;letter-spacing:-.05em}
.pill{border:1px solid var(--line);background:#fff;border-radius:999px;min-height:42px;padding:0 15px}
.expList{display:grid;gap:10px}.exp{border-radius:20px;padding:16px}.expTop{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.expTag{display:inline-flex;align-items:center;min-height:26px;padding:0 9px;border-radius:999px;background:var(--accent-soft);border:1px solid #d7e9ff;color:#3977b5;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.exp h3{font-size:19px;line-height:1.15;margin:10px 0 0;letter-spacing:-.035em}.exp button{border:0;background:none;color:var(--muted);font-size:18px;padding:0}
.expMeta{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}.expMeta span{font-size:12px;color:var(--muted);background:#f5f8fb;border-radius:999px;padding:7px 9px}
.expDetail{margin-top:13px;padding-top:13px;border-top:1px solid var(--line)}.expDetail dt{font-size:11px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.06em;margin-top:10px}.expDetail dt:first-child{margin-top:0}.expDetail dd{margin:4px 0 0;font-size:14px;line-height:1.45}
.expStatus{font-size:12px;font-weight:750}.expStatus.active{color:var(--accent-strong)}.expStatus.finished{color:var(--muted)}
dialog{width:min(500px,calc(100% - 28px));border:1px solid var(--line);border-radius:24px;padding:0;background:#fff;color:var(--text)}dialog::backdrop{background:rgba(28,42,58,.35);}
.modal{padding:22px}.modal h2{font-size:26px;margin:0 0 16px;letter-spacing:-.05em}.field{margin:12px 0}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;border-radius:13px;padding:13px}.field textarea{min-height:92px;resize:vertical}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.primary{border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:999px;min-height:42px;padding:0 17px;font-weight:750}
.menu{position:fixed;right:14px;bottom:calc(82px + env(safe-area-inset-bottom));width:min(290px,calc(100% - 28px));display:none;background:#fff;border:1px solid var(--line);border-radius:18px;padding:8px;z-index:40;box-shadow:0 18px 50px rgba(30,60,90,.16)}
.menu.open{display:block}.menu button,.menu label{display:flex;width:100%;min-height:43px;align-items:center;border:0;background:none;border-radius:11px;padding:0 12px}.danger{color:#b42318}.hide{display:none}
@media(max-width:390px){.app{padding-left:12px;padding-right:12px}.bottomNav{width:100%!important;height:58px}.navBtn{height:46px;font-size:12.5px;padding:0 5px}.overview h1{font-size:31px}.goal{font-size:18px}}

@media(min-width:900px){
  .app{max-width:1180px;padding:32px 32px 110px}
  .topbar{margin-bottom:28px}
  .logo{font-size:32px}
  .overview{padding:24px}
  .list{grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
  .card{padding:18px;min-width:0}
  .weekList{grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
  .weekHero{padding:24px}
  .expList{grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
  .bottomNav{width:470px!important}
  .menu{right:max(32px,calc((100vw - 1180px)/2 + 32px))}
}
@media(min-width:1280px){
  .app{max-width:1280px}
  .list{grid-template-columns:repeat(2,minmax(0,1fr))}
  .weekList{grid-template-columns:repeat(2,minmax(0,1fr))}
  .expList{grid-template-columns:repeat(3,minmax(0,1fr))}
}



</style>
</head>
<body>
<main class="app">
<header class="topbar"><div class="logo">MFPI</div><button class="icon" id="menuBtn">•••</button></header>
<section id="todayScreen" class="screen active">
  <div class="date" id="date"></div>
  <section class="overview">
    <div class="overviewTop"><div><h1 id="progressTitle">0 из 0</h1><p>задач выполнено сегодня</p></div><div class="streak" id="streak">0 дней подряд</div></div>
    <div class="segments" id="segments"></div>
    <div class="segmentLabels"><span>M</span><span>F</span><span>P</span><span>I</span></div>
  </section>
  <section class="list" id="grid"></section>
</section>
<section id="weekScreen" class="screen">
  <div class="date" id="weekDates"></div>
  <section class="weekHero"><small>ПРОГРЕСС НЕДЕЛИ</small><h2 id="weekPercent">0%</h2><div class="weekBar"><i id="weekFill"></i></div><div class="weekStats"><span id="weekDone">0 из 4 целей</span><span id="weekLabel">Эта неделя</span></div></section>
  <section class="weekList" id="weekList"></section>
</section>
<section id="experimentsScreen" class="screen">
  <div class="expHeader"><h2>Эксперименты</h2><button class="pill" id="addExp">Добавить</button></div>
  <div class="expList" id="expList"></div>
</section>
</main>
<nav class="bottomNav" style="grid-template-columns:repeat(3,1fr);width:min(520px,calc(100% - 24px))"><button class="navBtn active" data-screen="todayScreen">Сегодня</button><button class="navBtn" data-screen="weekScreen">Неделя</button><button class="navBtn" data-screen="experimentsScreen">Эксперименты</button></nav>
<div class="menu" id="menu"><button id="editAll">Изменить направления</button><button id="export">Экспорт данных</button><label for="import">Импорт данных</label><input class="hide" id="import" type="file" accept="application/json"><button id="clearDay">Очистить сегодня</button><button class="danger" id="reset">Удалить всё</button></div>
<dialog id="setup"><form class="modal" id="setupForm"><h2 id="setupTitle"></h2><div class="field"><input id="setupInput" maxlength="120"></div><div class="actions"><button type="button" class="pill" id="back">Назад</button><button class="primary" id="next">Далее</button></div></form></dialog>
<dialog id="edit"><form class="modal" id="editForm"><h2 id="editTitle">Изменить</h2><div class="field"><input id="editInput" maxlength="120"></div><div class="actions"><button type="button" class="pill close">Отмена</button><button class="primary">Сохранить</button></div></form></dialog>
<dialog id="weekDialog"><form class="modal" id="weekForm"><h2 id="weekDialogTitle">Цель на неделю</h2>
<div class="field"><label>Цель</label><input id="weekGoalInput" maxlength="180" required placeholder="Что должно быть достигнуто к концу недели"></div>
<div class="field"><label>Как измеряем прогресс</label><input id="weekTargetInput" type="number" min="1" max="10000" value="1" required></div>
<div class="actions"><button type="button" class="pill close">Отмена</button><button class="primary">Сохранить</button></div></form></dialog>
<dialog id="expDialog"><form class="modal" id="expForm"><h2>Новый эксперимент</h2>
<div class="field"><label>Категория</label><select id="expCat"></select></div>
<div class="field"><label>Название эксперимента</label><input id="expName" required maxlength="140" placeholder="Например: 30 дней кастингов"></div>
<div class="field"><label>Цель эксперимента</label><input id="expGoal" maxlength="180" placeholder="Что хочешь проверить или получить"></div>
<div class="field"><label>Описание</label><textarea id="expDescription" maxlength="700" placeholder="Что именно будешь делать"></textarea></div>
<div class="field"><label>Критерий успеха</label><textarea id="expCriteria" maxlength="500" placeholder="По каким признакам решишь, продолжать ли"></textarea></div>
<div class="field"><label>Дата начала</label><input id="expStart" type="date" required></div>
<div class="field"><label>Дата завершения</label><input id="expEnd" type="date" required></div>
<div class="actions"><button type="button" class="pill close">Отмена</button><button class="primary">Создать</button></div></form></dialog>
<script>
(()=>{const M=[['main','M','Главная'],['finance','F','Доходная'],['future','P','Перспективная'],['involve','I','Вовлекающая']];const O=[['main','Главная цель','Например: моделинг'],['finance','Доходное дело','Например: монтаж'],['future','Перспективное направление','Например: AI'],['involve','Вовлекающее дело','Например: музыка']];const key=(d=new Date())=>{const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return y+'-'+m+'-'+day};const fresh=()=>({onboarded:false,goals:{main:'',finance:'',future:'',involve:''},days:{},experiments:[],weeks:{},createdAt:key()});let S;try{S=JSON.parse(localStorage.getItem('mfpi'))||fresh()}catch{S=fresh()}S.goals=S.goals||{main:'',finance:'',future:'',involve:''};S.days=S.days||{};S.experiments=Array.isArray(S.experiments)?S.experiments:[];S.weeks=S.weeks||{};S.createdAt=S.createdAt||Object.keys(S.days).sort()[0]||key();let step=0,draft={},editing='',weekEditing='';const $=q=>document.querySelector(q),uid=()=>crypto.randomUUID?.()||Date.now()+Math.random(),esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),formatDate=x=>new Intl.DateTimeFormat('ru-RU',{day:'numeric',month:'short',year:'numeric'}).format(new Date(x+'T12:00:00'));function monday(d=new Date()){const x=new Date(d);x.setHours(12,0,0,0);const n=(x.getDay()+6)%7;x.setDate(x.getDate()-n);return x}
function weekKey(){return key(monday())}
function week(){const k=weekKey();return S.weeks[k]||(S.weeks[k]={goals:{main:{text:'',target:1,current:0},finance:{text:'',target:1,current:0},future:{text:'',target:1,current:0},involve:{text:'',target:1,current:0}}})}
function day(){return S.days[key()]||(S.days[key()]={tasks:{main:[],finance:[],future:[],involve:[]}})}function save(){localStorage.mfpi=JSON.stringify(S)}function render(){const D=day();$('#date').textContent=new Intl.DateTimeFormat('ru-RU',{weekday:'long',day:'numeric',month:'long'}).format(new Date());const allTasks=M.flatMap(m=>D.tasks[m[0]]||[]),totalTasks=allTasks.length,totalDone=allTasks.filter(x=>x.done).length;$('#progressTitle').textContent=totalDone+' из '+totalTasks;$('#segments').innerHTML=M.map(m=>{const tasks=D.tasks[m[0]]||[],done=tasks.filter(x=>x.done).length,fill=tasks.length?Math.round(done/tasks.length*100):0;return `<div class="segment" title="${m[2]}: ${done}/${tasks.length}"><div class="segmentFill" style="--fill:${fill}%"></div></div>`}).join('');$('#grid').innerHTML=M.map(m=>{const t=D.tasks[m[0]]||[],done=t.filter(x=>x.done).length;return `<article class="card"><div class="cardHead"><div class="badge">${m[1]}</div><div class="titleWrap"><div class="kind">${m[2]}</div><button class="editGoal" data-edit="${m[0]}"><div class="goal">${esc(S.goals[m[0]]||'Не определено')}</div></button></div><div class="count">${done}/${t.length}</div></div><div class="tasks">${t.length?t.map(x=>`<div class="task ${x.done?'done':''}" data-c="${m[0]}" data-id="${x.id}"><button class="check">${x.done?'✓':''}</button><div class="txt">${esc(x.text)}</div><button class="remove">×</button></div>`).join(''):'<div class="empty">Добавь один шаг на сегодня</div>'}</div><form class="add" data-c="${m[0]}"><input placeholder="Новый шаг" maxlength="120"><button>+</button></form></article>`}).join('');let n=0,c=new Date(),first=S.createdAt;while(key(c)>=first){if(!S.days[key(c)]&&key(c)!==key())break;n++;c.setDate(c.getDate()-1)}$('#streak').textContent=n+' '+(n===1?'день':'дней')+' подряд';const W=week(),mon=monday(),sun=new Date(mon);sun.setDate(sun.getDate()+6);$('#weekDates').textContent=formatDate(key(mon))+' — '+formatDate(key(sun));const wg=M.map(m=>W.goals[m[0]]||{text:'',target:1,current:0}),wp=wg.map(g=>g.text?Math.min(1,(Number(g.current)||0)/Math.max(1,Number(g.target)||1)):0),weekPct=Math.round(wp.reduce((a,b)=>a+b,0)/4*100),weekDone=wp.filter(x=>x>=1).length;$('#weekPercent').textContent=weekPct+'%';$('#weekFill').style.setProperty('--w',weekPct+'%');$('#weekDone').textContent=weekDone+' из 4 целей';$('#weekList').innerHTML=M.map((m,i)=>{const g=W.goals[m[0]]||{text:'',target:1,current:0},pct=Math.round(wp[i]*100);return `<article class="weekCard"><div class="weekHead"><div class="badge">${m[1]}</div><div class="titleWrap"><div class="kind">${m[2]}</div><div class="weekGoal">${g.text?esc(g.text):'Цель не задана'}</div></div><button class="weekEdit" data-week-edit="${m[0]}">${g.text?'Изменить':'Задать'}</button></div>${g.text?`<div class="weekProgress"><input type="range" min="0" max="${Math.max(1,Number(g.target)||1)}" step="1" value="${Math.min(Number(g.current)||0,Math.max(1,Number(g.target)||1))}" data-week-range="${m[0]}"><div class="weekNumbers"><span>${g.current||0} / ${g.target||1}</span><span>${pct}%</span></div></div>`:''}</article>`}).join('');
$('#expCat').innerHTML=M.map(m=>`<option value="${m[0]}">${m[2]}</option>`).join('');$('#expList').innerHTML=S.experiments.length?S.experiments.slice().sort((a,b)=>(a.end||'').localeCompare(b.end||'')).map(x=>{const cat=M.find(m=>m[0]===x.cat),end=x.end||'',start=x.start||'',d=end?Math.ceil((new Date(end+'T23:59:59')-new Date())/864e5):null,status=d===null?'Без срока':d>0?d+' дн. осталось':d===0?'Завершается сегодня':'Завершён',active=d===null||d>=0;return `<article class="exp"><div class="expTop"><div><span class="expTag">${cat?cat[1]+' · '+cat[2]:'Без категории'}</span><h3>${esc(x.name||'Без названия')}</h3></div><button data-del="${x.id}" aria-label="Удалить">×</button></div><div class="expMeta"><span class="expStatus ${active?'active':'finished'}">${status}</span>${start?`<span>Старт: ${formatDate(start)}</span>`:''}${end?`<span>До: ${formatDate(end)}</span>`:''}</div><dl class="expDetail">${(x.goal||S.goals[x.cat])?`<dt>Цель</dt><dd>${esc(x.goal||S.goals[x.cat])}</dd>`:''}${x.description?`<dt>Описание</dt><dd>${esc(x.description)}</dd>`:''}${x.criteria?`<dt>Критерий успеха</dt><dd>${esc(x.criteria)}</dd>`:''}</dl></article>`}).join(''):'<div class="empty">Экспериментов пока нет</div>';save()}function openSetup(){draft={...S.goals};step=0;showStep();$('#setup').showModal()}function showStep(){const x=O[step];$('#setupTitle').textContent=x[1];$('#setupInput').placeholder=x[2];$('#setupInput').value=draft[x[0]]||'';$('#back').style.visibility=step?'visible':'hidden';$('#next').textContent=step===3?'Готово':'Далее';setTimeout(()=>$('#setupInput').focus(),30)}$('#setupForm').onsubmit=e=>{e.preventDefault();const x=O[step],v=$('#setupInput').value.trim();if(!v)return;draft[x[0]]=v;if(step<3){step++;showStep()}else{S.goals={...draft};S.onboarded=true;$('#setup').close();render()}};$('#back').onclick=()=>{if(step){draft[O[step][0]]=$('#setupInput').value.trim();step--;showStep()}};$('#grid').onsubmit=e=>{const f=e.target.closest('.add');if(!f)return;e.preventDefault();
